<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Toon Story Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#10131b;color:#f4f2ec;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,560px)}h1{font-size:20px;margin:0 0 5px}p{color:#b9c0ce;font-size:13px;margin:0 0 14px}.stage{width:100%;aspect-ratio:9/16;border:1px solid #454b5b;border-radius:18px;overflow:hidden;background:#c99b67}canvas{width:100%;height:100%;display:block}.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 14px;background:#293246;color:white;font-weight:650;flex:1;min-width:100px}button.primary{background:#e45b43}#status{font-size:12px;color:#aeb8c9;margin-top:9px;min-height:18px}
</style></head><body><main><h1>toon story studio — conversation test</h1><p>two original characters talking, reacting, gesturing and moving in a western street.</p><div class="stage"><canvas id="c" width="720" height="1280"></canvas></div><div class="controls"><button id="play" class="primary">pause</button><button id="scene">change scene</button><button id="record">record 8 sec</button></div><div id="status">conversation animation running • code-drawn characters</div></main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),status=document.getElementById('status');
let running=true,t=0,scene=0,recorder=null,chunks=[];
const lines=[['“you said this was a good idea!”','“it was a good idea… five minutes ago.”'],['“did you hear that?”','“hear what?!”'],['“hand over the map.”','“come and take it, then.”']];
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function path(points,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()}
function bg(){
 let g=x.createLinearGradient(0,0,0,1280);g.addColorStop(0,scene===1?'#789db2':'#f4ca8d');g.addColorStop(.58,'#d9a66f');g.addColorStop(1,'#936044');x.fillStyle=g;x.fillRect(0,0,720,1280);
 x.fillStyle='#a87551';x.beginPath();x.moveTo(0,570);x.quadraticCurveTo(170,440,360,560);x.quadraticCurveTo(540,420,720,550);x.lineTo(720,900);x.lineTo(0,900);x.fill();
 x.fillStyle='#d6ae7b';x.beginPath();x.moveTo(190,590);x.lineTo(530,590);x.lineTo(720,1280);x.lineTo(0,1280);x.fill();
 // layered storefronts
 rr(10,390,205,400,8,'#8a5139');rr(31,435,62,112,4,'#29404a');rr(125,435,62,112,4,'#29404a');rr(0,365,225,48,5,'#4f342e');
 rr(505,410,205,380,8,'#985a3b');rr(532,455,62,112,4,'#29404a');rr(620,455,62,112,4,'#29404a');rr(490,385,230,45,5,'#4f342e');
 rr(250,455,220,100,7,'#4b3029');x.fillStyle='#f4d89b';x.font='bold 42px Georgia';x.textAlign='center';x.fillText(scene===1?'GENERAL STORE':'THE SALOON',360,518);
 // porch and posts
 rr(0,770,720,22,4,'#65402f');for(let xx of [25,205,505,685])rr(xx,580,16,220,4,'#6d4734');
 for(let i=0;i<30;i++){let xx=(i*89+15)%720,yy=850+(i*73)%410;x.fillStyle='rgba(88,56,38,.2)';x.beginPath();x.ellipse(xx,yy,8,3,.1,0,7);x.fill()}
}
function character(cx,cy,phase,id,speaking,emotion){
 x.save();x.translate(cx,cy+Math.sin(phase*2)*4);let walk=Math.sin(phase*2.5),gesture=speaking?Math.sin(t*8+id)*.65:Math.sin(phase)*.12;
 const coat=id?'#267b78':'#a94f36',trim=id?'#e8d8b4':'#e7c67f',ink='#29232b';
 // cast shadow
 x.fillStyle='rgba(44,31,25,.2)';x.beginPath();x.ellipse(0,210,62,12,0,0,7);x.fill();
 // legs animated separately
 path([[-13,125],[-15+walk*17,170],[-22+walk*23,207]],17,ink);path([[13,125],[15-walk*17,170],[22-walk*23,207]],17,ink);
 path([[-22+walk*23,207],[-44+walk*23,211]],12,ink);path([[22-walk*23,207],[44-walk*23,211]],12,ink);
 // torso jacket and vest
 x.fillStyle=coat;x.beginPath();x.moveTo(-40,20);x.quadraticCurveTo(0,0,40,20);x.lineTo(34,133);x.quadraticCurveTo(0,151,-34,133);x.closePath();x.fill();x.strokeStyle=ink;x.lineWidth=8;x.stroke();
 rr(-17,30,34,95,5,trim);path([[-31,34],[-18,65]],5,'#f1d7a2');path([[31,34],[18,65]],5,'#f1d7a2');
 // arms with speech gesture
 path([[-35,40],[-49,75],[-55-gesture*22,105-gesture*12]],13,ink);
 path([[35,40],[49,72],[55+gesture*28,92-gesture*25]],13,ink);
 x.fillStyle='#f1dfc6';x.beginPath();x.arc(55+gesture*28,92-gesture*25,8,0,7);x.fill();
 // neck and head
 rr(-12,-2,24,35,6,'#d9a77b');x.fillStyle='#f2e5d0';x.beginPath();x.ellipse(0,-39,55,62,0,0,7);x.fill();x.strokeStyle=ink;x.lineWidth=9;x.stroke();
 // hair / hat
 if(id){x.fillStyle='#30252a';x.beginPath();x.arc(0,-62,53,Math.PI,Math.PI*2);x.lineTo(48,-42);x.quadraticCurveTo(0,-57,-48,-42);x.fill()}
 else{ x.fillStyle='#c99549';x.beginPath();x.ellipse(0,-91,70,14,0,0,7);x.fill();rr(-43,-121,86,34,10,'#b77d3d');rr(-43,-93,86,7,3,'#75472f');}
 // eyes and expressive brows
 x.fillStyle=ink;x.beginPath();x.ellipse(-18,-47,5,9,0,0,7);x.ellipse(18,-47,5,9,0,0,7);x.fill();
 path([[-28,-61],[-15,-64]],5,ink);path([[15,-64],[28,-61]],5,ink);
 if(emotion==='surprised'){x.strokeStyle=ink;x.lineWidth=5;x.beginPath();x.arc(0,-17,10,0,7);x.stroke()}
 else if(speaking){let open=5+Math.abs(Math.sin(t*13+id))*12;rr(-13,-25,26,open,8,ink);if(open>12)rr(-7,-23,14,4,2,'#e88d79')}
 else{ x.strokeStyle=ink;x.lineWidth=5;x.beginPath();x.arc(0,-26,emotion==='angry'?13:11,.12,Math.PI-.12);x.stroke()}
 x.restore();
}
function draw(){
 x.clearRect(0,0,720,1280);x.save();let cam=Math.sin(t*.55)*9;x.translate(cam,0);x.scale(1+Math.sin(t*.35)*.012,1+Math.sin(t*.35)*.012);bg();
 let beat=Math.floor(t/3.2)%2,phase=t*1.8;
 // subtle approach and retreat through each exchange
 let shift=Math.sin(t*.65)*13;
 character(250-shift,835,phase,0,beat===0,scene===2?'angry':'normal');
 character(485+shift,800,phase+1,1,beat===1,scene===1&&beat===0?'surprised':'normal');
 // props and dust
 if(scene===0){rr(430,940,170,36,10,'#5a392c');rr(450,912,125,38,8,'#b9864c')}
 for(let i=0;i<8;i++){let xx=(i*107+t*28)%760,yy=1030+(i%3)*40;x.fillStyle='rgba(245,224,183,.25)';x.beginPath();x.arc(xx,yy,11+(i%3)*5,0,7);x.fill()}
 x.restore();
 let speaker=Math.floor(t/3.2)%2,caption=lines[scene][speaker];
 rr(38,1080,644,116,18,'rgba(15,18,26,.86)');x.font='bold 39px system-ui';x.textAlign='center';x.lineWidth=7;x.strokeStyle='#17151a';x.strokeText(caption,360,1148,600);x.fillStyle='white';x.fillText(caption,360,1148,600);
 x.font='20px system-ui';x.fillStyle='rgba(255,255,255,.8)';x.fillText('TOON STORY STUDIO • CONVERSATION TEST',360,1235);
}
function loop(){if(running){t+=1/30;draw()}requestAnimationFrame(loop)}loop();
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'pause':'play'};
document.getElementById('scene').onclick=()=>{scene=(scene+1)%3;draw();status.textContent='set '+(scene+1)+' • new dialogue and location'};
document.getElementById('record').onclick=()=>{if(!c.captureStream||!window.MediaRecorder){status.textContent='recording unsupported here — use your phone screen recorder';return}if(recorder&&recorder.state==='recording'){recorder.stop();return}chunks=[];let stream=c.captureStream(30),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';try{recorder=new MediaRecorder(stream,{mimeType:mime})}catch(e){status.textContent='recording unavailable in this browser';return}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toon-conversation-test.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='recording ready — import the WebM into CapCut';document.getElementById('record').textContent='record 8 sec'};recorder.start();status.textContent='recording…';document.getElementById('record').textContent='stop recording';setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},8000)};
</script></body></html>
