name: CapCut setup diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capcut-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show runner environment
        run: |
          echo "Runner: $(uname -a)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Working directory: $GITHUB_WORKSPACE"

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Check Codex CLI
        run: codex --version

      - name: Check registered plugin marketplaces
        run: codex plugin marketplace list --json

      - name: Check CapCut plugin availability
        run: codex plugin list --marketplace CapCut --available --json
